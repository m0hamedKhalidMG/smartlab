<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>بلاغاتي — Smart Lab</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-brand"><i class="fas fa-laptop-code"></i><span>Smart Lab</span></div>
    <nav class="sidebar-nav">
      <a href="/dashboard.html"   class="nav-item" data-page="dashboard.html"   data-roles="admin,technician">        <i class="fas fa-gauge-high"></i>           لوحة التحكم</a>
      <a href="/devices.html"     class="nav-item" data-page="devices.html"     data-roles="admin,technician">        <i class="fas fa-desktop"></i>             الأجهزة</a>
      <a href="/issues.html"      class="nav-item" data-page="issues.html"      data-roles="admin,technician,user">   <i class="fas fa-triangle-exclamation"></i> بلاغاتي</a>
      <a href="/maintenance.html" class="nav-item" data-page="maintenance.html" data-roles="admin,technician">        <i class="fas fa-screwdriver-wrench"></i>   الصيانة</a>
      <a href="/map.html"         class="nav-item" data-page="map.html"         data-roles="admin,technician">        <i class="fas fa-map"></i>                 الخريطة</a>
      <a href="/alerts.html"      class="nav-item" data-page="alerts.html"      data-roles="admin,technician">        <i class="fas fa-bell"></i>                التنبيهات</a>
      <a href="/ai.html"          class="nav-item" data-page="ai.html"          data-roles="admin,technician,user">   <i class="fas fa-robot"></i>               مساعد AI</a>
      <a href="/reports.html"     class="nav-item" data-page="reports.html"     data-roles="admin,technician">        <i class="fas fa-chart-bar"></i>           التقارير</a>
      <a href="/admin.html"       class="nav-item" data-page="admin.html" id="admin-link" data-roles="admin">         <i class="fas fa-users-cog"></i> المستخدمون</a>
    </nav>
    <div class="sidebar-footer">Smart Lab &copy; 2026</div>
  </aside>

  <header class="topbar">
    <span class="topbar-title">بلاغاتي</span>
    <div class="topbar-actions">
      <div class="alert-bell" onclick="window.location='/alerts.html'"><i class="fas fa-bell"></i><span class="badge-count" id="unread-count" style="display:none">0</span></div>
      <div class="topbar-user"><div class="avatar" id="user-avatar">م</div><span id="user-name">مستخدم</span></div>
      <button class="btn btn-outline btn-sm" id="logout-btn"><i class="fas fa-sign-out-alt"></i> خروج</button>
    </div>
  </header>

  <main class="main-content">
    <h2 class="page-title" style="margin-bottom:1rem">الأعطال والبلاغات</h2>

    <div class="grid grid-1-2">
      <!-- Form تقديم بلاغ -->
      <div class="card" style="align-self:start">
        <div class="card-header">
          <span class="card-title"><i class="fas fa-plus-circle" style="color:var(--primary)"></i> تقديم بلاغ جديد</span>
        </div>
        <form id="issue-form">
          <div class="form-group">
            <label class="form-label">الجهاز *</label>
            <select class="form-control" id="f-device" required><option value="">— اختر الجهاز —</option></select>
          </div>
          <div class="form-group">
            <label class="form-label">نوع المشكلة *</label>
            <select class="form-control" id="f-type" required>
              <option value="">— اختر النوع —</option>
              <option>عطل في الشاشة</option>
              <option>مشكلة في الكيبورد</option>
              <option>الجهاز لا يعمل</option>
              <option>بطء شديد</option>
              <option>مشكلة في الشبكة</option>
              <option>عطل في الماوس</option>
              <option>مشكلة في الصوت</option>
              <option>أخرى</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">الأولوية</label>
            <select class="form-control" id="f-priority">
              <option value="low">منخفضة</option>
              <option value="medium" selected>متوسطة</option>
              <option value="high">عالية</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">وصف المشكلة *</label>
            <textarea class="form-control" id="f-desc" placeholder="اشرح المشكلة بالتفصيل..." rows="4" required></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">صورة (اختياري)</label>
            <input type="file" class="form-control" id="f-image" accept="image/*" />
          </div>

          <!-- AI Suggestion Box -->
          <div class="ai-box hidden" id="ai-box">
            <div class="ai-box-header"><i class="fas fa-robot"></i> اقتراحات Gemini AI</div>
            <pre id="ai-text">جاري التحليل...</pre>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.5rem">
            <i class="fas fa-paper-plane"></i> إرسال البلاغ
          </button>
        </form>
      </div>

      <!-- جدول البلاغات -->
      <div class="card">
        <div class="card-header">
          <span class="card-title"><i class="fas fa-list" style="color:var(--danger)"></i> بلاغاتي</span>
          <select class="form-control" id="status-filter" style="max-width:150px">
            <option value="">الكل</option>
            <option value="open">مفتوح</option>
            <option value="in_progress">قيد العمل</option>
            <option value="resolved">محلول</option>
          </select>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr><th>الجهاز</th><th>المشكلة</th><th>الأولوية</th><th>الحالة</th><th>التاريخ</th><th>إجراء</th></tr>
            </thead>
            <tbody id="issues-tbody">
              <tr><td colspan="6" style="text-align:center;padding:2rem"><i class="fas fa-spinner fa-spin"></i></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>

    <!-- Modal عرض تفاصيل البلاغ -->
    <div class="modal-overlay hidden" id="detail-modal">
      <div class="modal" style="max-width:520px">
        <div class="modal-header"><span>تفاصيل البلاغ</span><button class="modal-close" id="detail-modal-close"><i class="fas fa-times"></i></button></div>
        <div class="modal-body" id="detail-body">
          <!-- محتوى ديناميكي -->
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" id="detail-modal-close-btn">إغلاق</button>
        </div>
      </div>
    </div>

    <!-- Modal تحديث الحالة -->
    <div class="modal-overlay hidden" id="status-modal">
      <div class="modal" style="max-width:420px">
        <div class="modal-header"><span>تحديث حالة البلاغ</span><button class="modal-close" id="status-modal-close"><i class="fas fa-times"></i></button></div>
        <div class="modal-body">
          <input type="hidden" id="edit-issue-id" />
          <div class="form-group"><label class="form-label">الحالة الجديدة</label>
            <select class="form-control" id="new-status">
              <option value="open">مفتوح</option>
              <option value="in_progress">قيد العمل</option>
              <option value="resolved">محلول</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label">ملاحظات الإصلاح</label><textarea class="form-control" id="resolution-notes" rows="3"></textarea></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" id="status-modal-cancel">إلغاء</button>
          <button class="btn btn-primary" id="status-save"><i class="fas fa-save"></i> حفظ</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { requireAuth, apiGet, apiPost, apiPatch, apiForm, fillTopbar, setActiveNav, logout, toast, formatDate, debounce, filterSidebar } from '/js/api.js';

    const user = requireAuth(); if (!user) throw new Error('stop');
    fillTopbar(); setActiveNav();
    filterSidebar();
    document.getElementById('logout-btn').addEventListener('click', logout);

    const STAT_LBL  = { open:'مفتوح', in_progress:'قيد العمل', resolved:'محلول' };
    const STAT_MAP  = { open:'badge-open', in_progress:'badge-in_progress', resolved:'badge-resolved' };
    const PRIORI    = { low:'منخفضة', medium:'متوسطة', high:'عالية' };
    let currentPage = 1;
    let currentIssues = [];

    // تحميل الأجهزة في Select
    const deviceSel = document.getElementById('f-device');
    const presetDevice = new URLSearchParams(window.location.search).get('device');
    apiGet('/api/devices?limit=100').then(res => {
      res.devices.forEach(d => {
        const o = new Option(d.name, d.id);
        deviceSel.appendChild(o);
      });
      if (presetDevice) deviceSel.value = presetDevice;
    });

    // AI Debounce
    const canAI = ['admin','technician'].includes(user.role);
    const descEl  = document.getElementById('f-desc');
    const aiBox   = document.getElementById('ai-box');
    const aiText  = document.getElementById('ai-text');

    if (canAI) {
      descEl.addEventListener('input', debounce(async () => {
        const desc = descEl.value.trim();
        if (desc.length < 10) return;
        aiBox.classList.remove('hidden');
        aiText.textContent = 'جاري التحليل بواسطة Gemini AI...';
        try {
          const res = await apiPost('/api/ai/diagnose', { description: desc, device_id: deviceSel.value || null });
          aiText.textContent = res.suggestion;
        } catch(e) { aiText.textContent = 'تعذر الحصول على اقتراحات الآن'; }
      }, 1200));
    }

    // إرسال البلاغ
    document.getElementById('issue-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData();
      fd.append('device_id',  document.getElementById('f-device').value);
      fd.append('issue_type', document.getElementById('f-type').value);
      fd.append('description',document.getElementById('f-desc').value);
      fd.append('priority',   document.getElementById('f-priority').value);
      const img = document.getElementById('f-image').files[0];
      if (img) fd.append('image', img);

      try {
        const res = await apiForm('/api/issues', fd);
        // حفظ اقتراح AI في البلاغ
        if (canAI && aiText.textContent.length > 10 && aiText.textContent !== 'جاري التحليل بواسطة Gemini AI...') {
          await apiPatch(`/api/issues/${res.issue.id}/ai`, { ai_suggestions: aiText.textContent });
        }
        toast('تم إرسال البلاغ بنجاح', 'success');
        e.target.reset();
        aiBox.classList.add('hidden');
        loadIssues();
      } catch(err) { toast(err.message, 'error'); }
    });

    // تحميل الجدول
    async function loadIssues() {
      const status = document.getElementById('status-filter').value;
      const res = await apiGet(`/api/issues?page=${currentPage}&limit=8${status?'&status='+status:''}`);
      const tbody = document.getElementById('issues-tbody');
      currentIssues = res.issues || [];

      if (!res.issues.length) {
        tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-inbox"></i><p>لا توجد بلاغات</p></div></td></tr>';
      } else {
        tbody.innerHTML = res.issues.map((i, idx) => `
          <tr style="cursor:pointer" onclick="openDetail(${idx})" title="اضغط لعرض التفاصيل">
            <td>${i.device_name||'—'}</td>
            <td>${i.issue_type}</td>
            <td><span class="badge badge-${i.priority}">${PRIORI[i.priority]}</span></td>
            <td><span class="badge ${STAT_MAP[i.status]}">${STAT_LBL[i.status]}</span></td>
            <td>${formatDate(i.created_at)}</td>
            <td onclick="event.stopPropagation()">${canAI && i.status!=='resolved' ? `<button class="btn btn-outline btn-sm btn-icon" onclick="openStatus(${i.id},'${i.status}')" title="تحديث"><i class="fas fa-pen-to-square"></i></button>`:''}</td>
          </tr>`).join('');
      }
      buildPagination(res.total, res.limit);

      // Unread alerts
      try { const a = await apiGet('/api/alerts?is_read=0'); if(a.unread>0){const el=document.getElementById('unread-count');el.textContent=a.unread;el.style.display='flex';} } catch{}
    }

    function buildPagination(total, limit) {
      const pages = Math.ceil(total / limit);
      const parent = document.getElementById('pagination');
      if (pages <= 1) { parent.innerHTML=''; return; }
      let html = `<button class="page-btn" ${currentPage===1?'disabled':''} onclick="changePage(${currentPage-1})">‹</button>`;
      for (let i = 1; i <= pages; i++) html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="changePage(${i})">${i}</button>`;
      html += `<button class="page-btn" ${currentPage===pages?'disabled':''} onclick="changePage(${currentPage+1})">›</button>`;
      parent.innerHTML = html;
    }

    window.changePage = (p) => { currentPage = p; loadIssues(); };
    document.getElementById('status-filter').addEventListener('change', () => { currentPage=1; loadIssues(); });

    // Modal عرض التفاصيل
    const detailModal = document.getElementById('detail-modal');
    const detailBody  = document.getElementById('detail-body');

    window.openDetail = (idx) => {
      const i = currentIssues[idx];
      if (!i) return;
      detailBody.innerHTML = `
        <div style="margin-bottom:1rem">
          <label class="form-label">الجهاز</label>
          <div style="font-weight:600">${i.device_name||'—'} ${i.device_type ? '— ' + i.device_type : ''}</div>
        </div>
        <div style="margin-bottom:1rem">
          <label class="form-label">نوع المشكلة</label>
          <div>${i.issue_type}</div>
        </div>
        <div style="margin-bottom:1rem">
          <label class="form-label">الوصف</label>
          <div style="background:#f8fafc;padding:.75rem;border-radius:8px;border:1px solid var(--border);line-height:1.7">${i.description||'—'}</div>
        </div>
        <div style="margin-bottom:1rem">
          <label class="form-label">الحالة</label>
          <div><span class="badge ${STAT_MAP[i.status]}">${STAT_LBL[i.status]}</span></div>
        </div>
        <div style="margin-bottom:1rem">
          <label class="form-label">الأولوية</label>
          <div><span class="badge badge-${i.priority}">${PRIORI[i.priority]}</span></div>
        </div>
        ${i.resolution_notes ? `<div style="margin-bottom:1rem"><label class="form-label">ملاحظات الإصلاح</label><div style="background:#f0fdf4;padding:.75rem;border-radius:8px;border:1px solid #bbf7d0;line-height:1.7">${i.resolution_notes}</div></div>` : ''}
        ${i.ai_suggestions ? `<div style="margin-bottom:1rem"><label class="form-label"><i class="fas fa-robot" style="color:var(--primary)"></i> اقتراحات AI</label><div style="background:#eff6ff;padding:.75rem;border-radius:8px;border:1px solid #bfdbfe;line-height:1.7;white-space:pre-wrap">${i.ai_suggestions}</div></div>` : ''}
        ${i.image_path ? `<div style="margin-bottom:1rem"><label class="form-label">الصورة المرفقة</label><img src="${i.image_path}" style="max-width:100%;border-radius:8px;border:1px solid var(--border)" /></div>` : ''}
        <div style="color:var(--text-muted);font-size:.85rem">
          <div>📅 التاريخ: ${formatDate(i.created_at)}</div>
          ${i.resolved_at ? `<div>✅ تاريخ الحل: ${formatDate(i.resolved_at)}</div>` : ''}
          <div>👤 مقدم البلاغ: ${i.reporter_name||'—'}</div>
          ${i.resolver_name ? `<div>🔧 الفني: ${i.resolver_name}</div>` : ''}
        </div>
      `;
      detailModal.classList.remove('hidden');
    };
    document.getElementById('detail-modal-close').addEventListener('click', () => detailModal.classList.add('hidden'));
    document.getElementById('detail-modal-close-btn').addEventListener('click', () => detailModal.classList.add('hidden'));

    // Modal تحديث الحالة
    const statusModal = document.getElementById('status-modal');
    window.openStatus = (id, status) => {
      document.getElementById('edit-issue-id').value = id;
      document.getElementById('new-status').value    = status;
      document.getElementById('resolution-notes').value = '';
      statusModal.classList.remove('hidden');
    };
    document.getElementById('status-modal-close').addEventListener('click', () => statusModal.classList.add('hidden'));
    document.getElementById('status-modal-cancel').addEventListener('click', () => statusModal.classList.add('hidden'));
    document.getElementById('status-save').addEventListener('click', async () => {
      const id     = document.getElementById('edit-issue-id').value;
      const status = document.getElementById('new-status').value;
      const notes  = document.getElementById('resolution-notes').value;
      try {
        await apiPatch(`/api/issues/${id}/status`, { status, resolution_notes: notes });
        statusModal.classList.add('hidden');
        toast('تم تحديث الحالة', 'success');
        loadIssues();
      } catch(e) { toast(e.message, 'error'); }
    });

    loadIssues();
  </script>
</body>
</html>
